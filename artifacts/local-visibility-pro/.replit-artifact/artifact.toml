kind = "web"
previewPath = "/"
title = "Local Visibility Pro"
description = "A client-facing local visibility management dashboard for Bridge Legal Services, with reporting, listings, reviews, rankings, competitor insights, recommendations, tasks, content planning, billing, settings, and support."
version = "1.0.0"
id = "artifacts/local-visibility-pro"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21278

[services.development]
run = "pnpm --filter @workspace/local-visibility-pro run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/local-visibility-pro", "run", "build" ]
serve = "static"
publicDir = "artifacts/local-visibility-pro/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21278"
BASE_PATH = "/"
